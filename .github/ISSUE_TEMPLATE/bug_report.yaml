---
name: Bug Report
description: File a bug report.
title: "bug: "
labels: ["bug", "triage"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please check that a similar issue does not already exist before submitting.
  - type: dropdown
    id: service
    attributes:
      label: Affected service
      description: Which part of os-fleet is concerned?
      multiple: true
      options:
        - control-tower-api
        - control-tower-console
        - dispatch-service
        - fleet-service
        - geocoding-service
        - notification-service
        - parcel-service
        - tracking-console
        - tracking-service
        - Other / I don't know
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Go to '...'
        2. Call '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error messages if any.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version or commit SHA where you saw the bug.
      placeholder: e.g. v0.1.0 or 4afc412
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant logs or drag in screenshots. Remove any secrets first.
      render: shell
